version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - perfsprint
    - modernize
    - unconvert
    - thelper
    - tagliatelle
    - usetesting
    - dupl
    - gocyclo
    - gocognit
    - unparam

  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 15
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments

  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - dupl

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
